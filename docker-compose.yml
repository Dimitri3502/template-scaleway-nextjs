name: acme

# Les variables viennent de la source unique de configuration locale : apps/web/.env.
# Lancer via `pnpm infra:up` (qui passe --env-file apps/web/.env) plutôt que `docker compose up`.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acme}
      POSTGRES_DB: ${POSTGRES_DB:-acme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acme} -d ${POSTGRES_DB:-acme}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-acme-access-key}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-acme-secret-key}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Crée le bucket privé versionné. Aucune politique anonyme : tout accès passe par une URL signée.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-acme-attachments}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-acme-access-key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-acme-secret-key}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set acme http://minio:9000 "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}"
        mc mb --ignore-existing "acme/$${S3_BUCKET}"
        mc anonymous set none "acme/$${S3_BUCKET}"
        mc version enable "acme/$${S3_BUCKET}"
        mc admin config set acme api cors_allow_origin="*"
        mc admin service restart acme
        echo "Bucket $${S3_BUCKET} prêt (privé, versionné)."

volumes:
  postgres-data:
  minio-data:
